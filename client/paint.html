<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/paint.css">
  <title>Atelier</title>
</head>
<body class="tool-brush">

<header>
  <div class="header-left">
    <a href="/" class="btn-back">← Galerie</a>
    <label class="piece-name"></label>
  </div>


  <div class="header-center">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut" title="Dézoom (Ctrl+−)">−</button>
      <span class="zoom-level" id="zoomReset" title="Réinitialiser le zoom (Ctrl+0)">100%</span>
      <button class="zoom-btn" id="zoomIn"  title="Zoom (Ctrl+=)">+</button>
    </div>
  </div>

  <div class="header-right">
    <button class="btn-undo" title="Annuler (Ctrl+Z)" disabled>↩</button>
    <button class="btn-redo" title="Rétablir (Ctrl+Y)" disabled>↪</button>
  </div>
</header>

<div class="workspace">

  
  <div class="canvas-area">

    <div class="ref-panel" id="refPanel">
      <div class="ref-header" id="refHeader">
        <span class="ref-label">Référence</span>
        <span class="ref-toggle">▼</span>
      </div>
      <div class="ref-body">
        <div class="ref-img-wrap">
          <img class="original-art" src="" alt="Œuvre originale" />
        </div>
        <div class="ref-hint">Reproduis cette œuvre avec les couleurs de la palette.</div>
      </div>
     
      <div class="ref-resize-handle" id="refResize" title="Redimensionner">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M9 1L1 9M9 5L5 9M9 9" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="canvas-viewport">
      <canvas></canvas>
    </div>
  </div>

 
  <div class="tool-panel">

    <div class="tool-section">
      <div class="tool-section-label">Outil</div>
      <div class="tool-row">
        <button class="tool-btn active" id="paintbrush" title="Pinceau (B)">
          <span class="icon">🖌️</span>Brosse
        </button>
        <button class="tool-btn" id="bucket" title="Remplissage (G)">
          <span class="icon">🪣</span>Remplir
        </button>
        <button class="tool-btn" id="eraser" title="Gomme (E)">
          <span class="icon">⬜</span>Gomme
        </button>
      </div>
    </div>

    <div class="tool-section">
      <div class="tool-section-label">Taille</div>
      <div class="size-row">
        <button class="size-btn active" data-size="3">
          <div class="size-dot" style="width:4px;height:4px"></div>
        </button>
        <button class="size-btn" data-size="8">
          <div class="size-dot" style="width:8px;height:8px"></div>
        </button>
        <button class="size-btn" data-size="16">
          <div class="size-dot" style="width:13px;height:13px"></div>
        </button>
        <button class="size-btn" data-size="28">
          <div class="size-dot" style="width:18px;height:18px"></div>
        </button>
      </div>
    </div>

    <div class="tool-section">
      <div class="tool-section-label">Palette</div>
      <div class="colors-grid" id="colorsGrid"></div>
      <div class="current-color-wrap">
        <div class="current-color-swatch" id="currentSwatch"></div>
        <div class="current-color-label" id="currentColorLabel">Couleur active</div>
      </div>
    </div>

    <div class="tool-section" style="border-bottom:none; margin-top:auto;">
      <div class="action-row">
        <button class="btn-action btn-clear">Effacer tout</button>
        <button class="btn-action btn-save">Sauvegarder →</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/paint.js" defer></script>
</body>
</html>
